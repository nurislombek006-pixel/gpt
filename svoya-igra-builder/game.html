<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071529"><title>Своя игра</title>
<style>
:root{color-scheme:dark;--bg:#071529;--panel:#102b4d;--gold:#ffdb75;--line:#3c6290;--muted:#b6c6dd}*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh;background:radial-gradient(circle at 50% -20%,#284d7c,transparent 50%),var(--bg)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--gold)}header,main,footer{max-width:1510px;margin:auto;padding:22px clamp(12px,3vw,36px)}header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:15px}h1{font-size:clamp(32px,5vw,60px);margin:5px 0;letter-spacing:-.045em}.gold{color:var(--gold)}.desc{color:var(--muted);font-size:14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.btn{padding:12px 16px;background:#1a385e;border:1px solid var(--line);border-radius:12px;color:#fff;font-weight:750}.btn:hover{background:#274e7d}.btn.primary{color:#19263b;background:var(--gold);border-color:var(--gold)}.btn.green{background:#187558;border-color:#40bb92}.btn.red{background:#733045;border-color:#c95b76}.btn:disabled{opacity:.36;cursor:default}main{padding-top:0}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:5px 0 25px}.team{padding:15px;border:1px solid #385a82;border-radius:15px;background:linear-gradient(145deg,#15375e,#0c2039);text-align:left}.team.active{border-color:var(--gold);box-shadow:0 0 0 1px #d3a84455}.team-name{font-size:14px;font-weight:800;color:#d5e6ff}.score{font-size:clamp(27px,4vw,44px);font-weight:900;color:var(--gold)}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px;gap:10px}.scroll{overflow:auto;padding-bottom:16px}.board{display:grid;gap:9px;min-width:max-content}.category{min-height:82px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#245183,#15365e);border:1px solid #557ca4;border-radius:13px;padding:12px 8px;max-width:200px;font-size:15px;font-weight:850;line-height:1.3}.cell{height:90px;background:linear-gradient(140deg,#1a467b,#0d2d53);border:1px solid #426f9e;border-radius:13px;color:var(--gold);font-size:35px;font-weight:900;transition:.14s}.cell:hover:not(:disabled){transform:translateY(-2px);background:#27609a}.cell.used{background:#172638;border-color:#263b51;color:#62758d;cursor:default}.overlay{display:none;position:fixed;inset:0;z-index:20;background:#020913e9;backdrop-filter:blur(8px);padding:14px;align-items:center;justify-content:center}.overlay.open{display:flex}.dialog{max-height:calc(100vh - 28px);overflow:auto;width:min(820px,100%);padding:clamp(17px,3vw,34px);border:1px solid #527fac;border-radius:23px;background:radial-gradient(circle at top right,#254978,#0a1b30 75%);box-shadow:0 30px 80px #000b}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.tag{font-size:12px;font-weight:900;color:var(--gold);letter-spacing:.05em}.x{background:#21466e;border:1px solid #5281ad;border-radius:10px;color:#fff;font-size:24px;width:38px;height:38px}.question{font-size:clamp(25px,4.4vw,46px);font-weight:800;line-height:1.25;margin:32px 0}.answer{display:none;border:1px solid #3d9a8b;background:#11504155;padding:18px;border-radius:15px;font-size:clamp(19px,2.7vw,27px);line-height:1.45;margin:18px 0}.answer.show{display:block}.buttons{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:20px}.hint{font-size:12px;color:var(--muted);margin-top:17px}.pw{padding:14px;border-radius:12px;border:1px solid #5178a1;background:#081c35;color:#fff;font-size:22px;width:100%;margin:14px 0}.error{font-size:13px;min-height:20px;color:#ff8199}footer{color:#95abc6;font-size:12px;text-align:center}#finish{display:none;position:fixed;inset:0;background:#06162ef2;z-index:40;place-items:center;padding:20px}#finish.open{display:grid}.winner{text-align:center;max-width:530px;width:100%;padding:35px;border-radius:24px;border:1px solid #bfa061;background:linear-gradient(145deg,#1e4875,#0c203a)}.winner h2{font-size:40px}.winner p{font-size:22px;color:#d7e6f5}@media(max-width:600px){.board{gap:6px}.category{font-size:13px}.cell{height:77px;font-size:27px}.btn{font-size:13px;padding:10px 12px}.teams{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><header><div><div class="desc">ИНТЕРАКТИВНАЯ ВИКТОРИНА</div><h1>СВОЯ <span class="gold">ИГРА</span></h1><div class="desc" id="subtitle"></div></div><div class="toolbar"><button id="undo" class="btn">↶ Отменить</button><button id="admin" class="btn">🔐 Ответы</button><button id="reset" class="btn">↻ Сбросить</button></div></header><main><section class="teams" id="teams"></section><div class="progress"><span>Выбери команду и стоимость вопроса</span><span id="progress"></span></div><div class="scroll"><div class="board" id="board"></div></div></main><footer>Ответы открываются только по паролю ведущего. Счёт и прогресс сохраняются на этом устройстве.</footer>
<div class="overlay" id="quiz"><div class="dialog"><div class="top"><span id="meta" class="tag"></span><button id="close" class="x">×</button></div><div class="question" id="question"></div><div id="answer" class="answer"></div><div class="buttons" id="before"><button class="btn" id="skip">Отмена</button><button class="btn primary" id="reveal">Показать ответ</button></div><div class="buttons" id="after" style="display:none"><button class="btn red" id="wrong">− Неверно</button><button class="btn" id="neutral">Без баллов</button><button class="btn green" id="correct">+ Верно</button></div><div class="hint">Очки присваиваются выбранной команде. Кнопка «Отмена» не тратит вопрос.</div></div></div>
<div class="overlay" id="login"><div class="dialog" style="max-width:480px"><div class="top"><span class="tag">РЕЖИМ ВЕДУЩЕГО</span><button id="closeLogin" class="x">×</button></div><h2>Пароль для ответов</h2><form id="pinForm"><input type="password" id="pin" class="pw" placeholder="Введите пароль" autocomplete="off" required><div class="error" id="err"></div><div class="buttons"><button type="button" class="btn" id="cancelLogin">Отмена</button><button type="submit" class="btn primary">Войти</button></div></form></div></div>
<div id="finish"><div class="winner"><div style="font-size:75px">🏆</div><h2>Игра окончена!</h2><p id="result"></p><button id="again" class="btn primary">Начать заново</button><button id="view" class="btn">Посмотреть поле</button></div></div>
<script>
"use strict";
const GAME = __QUIZ_JSON__;
const $=id=>document.getElementById(id);
const key="svoya-game-"+GAME.id;
const start=()=>({scores:Array(GAME.teams).fill(0),active:0,used:[],history:[]});
let state=start(),current=null,pending=false,openAnswers=false;
try{const s=JSON.parse(localStorage.getItem(key)||"null");if(s&&Array.isArray(s.scores)&&s.scores.length===GAME.teams&&Array.isArray(s.used)&&Array.isArray(s.history))state=s}catch(e){}
$("subtitle").textContent=GAME.title+" · "+GAME.categories.length+" тем · "+GAME.categories.reduce((n,c)=>n+c.qs.length,0)+" вопросов";
function save(){localStorage.setItem(key,JSON.stringify(state))}
function show(id,value){$(id).classList.toggle("open",value);document.body.style.overflow=document.querySelector(".overlay.open")?"hidden":""}
function render(){const t=$("teams");t.replaceChildren();state.scores.forEach((s,i)=>{const b=document.createElement("button");b.className="team"+(i===state.active?" active":"");const n=document.createElement("div");n.className="team-name";n.textContent="Команда "+(i+1)+(state.active===i?" · ХОД":"");const v=document.createElement("div");v.className="score";v.textContent=s;b.append(n,v);b.onclick=()=>{state.active=i;save();render()};t.append(b)});const b=$("board");b.replaceChildren();const n=GAME.categories.length;b.style.gridTemplateColumns="repeat("+n+",minmax(133px,200px))";for(const c of GAME.categories){const e=document.createElement("div");e.className="category";e.textContent=c.name;b.append(e)}const max=Math.max(...GAME.categories.map(c=>c.qs.length));for(let r=0;r<max;r++)for(let c=0;c<n;c++){const q=GAME.categories[c].qs[r],id=c+"-"+r;const e=document.createElement("button");e.className="cell"+(state.used.includes(id)?" used":"");e.textContent=q?(state.used.includes(id)?"✓":(r+1)*100):"—";e.disabled=!q||state.used.includes(id);if(q)e.onclick=()=>openQuestion(c,r);b.append(e)}$("progress").textContent=state.used.length+"/"+GAME.categories.reduce((n,c)=>n+c.qs.length,0)+" сыграно";$("undo").disabled=!state.history.length;$("admin").textContent=openAnswers?"🔓 Ответы открыты":"🔐 Ответы"}
function openQuestion(c,r){current={c,r,id:c+"-"+r,value:(r+1)*100};$("meta").textContent=GAME.categories[c].name+" · "+current.value+" баллов";$("question").textContent=GAME.categories[c].qs[r][0];$("answer").textContent=GAME.categories[c].qs[r][1];$("answer").classList.remove("show");$("before").style.display="flex";$("after").style.display="none";show("quiz",true)}
function closeQuestion(){show("quiz",false);current=null}
function reveal(){if(!current)return;if(!openAnswers){pending=true;show("login",true);return}$("answer").classList.add("show");$("before").style.display="none";$("after").style.display="flex"}
function score(mul){if(!current)return;state.history.push(JSON.stringify({scores:state.scores.slice(),active:state.active,used:state.used.slice()}));state.scores[state.active]+=current.value*mul;state.used.push(current.id);save();closeQuestion();render();if(state.used.length===GAME.categories.reduce((n,c)=>n+c.qs.length,0)){const m=Math.max(...state.scores);const winners=state.scores.map((v,i)=>v===m?i+1:null).filter(Boolean);$("result").textContent=(winners.length===1?"Победила команда "+winners[0]:"Ничья! Команды "+winners.join(", "))+" · Счёт: "+state.scores.join(" : ");$("finish").classList.add("open")}}
$("reveal").onclick=reveal;$("close").onclick=$("skip").onclick=closeQuestion;$("correct").onclick=()=>score(1);$("wrong").onclick=()=>score(-1);$("neutral").onclick=()=>score(0);
$("pinForm").onsubmit=e=>{e.preventDefault();if($("pin").value===GAME.password){openAnswers=true;show("login",false);$("err").textContent="";$("pin").value="";render();if(pending){pending=false;reveal()}}else{$("err").textContent="Неверный пароль"}};
function closeLogin(){pending=false;show("login",false)}
$("closeLogin").onclick=$("cancelLogin").onclick=closeLogin;
$("admin").onclick=()=>{if(openAnswers){openAnswers=false;render()}else{pending=false;show("login",true)}};
$("reset").onclick=$("again").onclick=()=>{if(confirm("Сбросить вопросы и очки всех команд?")){state=start();save();$("finish").classList.remove("open");render()}};
$("view").onclick=()=>$("finish").classList.remove("open");
$("undo").onclick=()=>{const prev=state.history.pop();if(!prev)return;const p=JSON.parse(prev);state.scores=p.scores;state.used=p.used;state.active=p.active;save();render();$("finish").classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("login").classList.contains("open"))closeLogin();else if($("quiz").classList.contains("open"))closeQuestion()}});
render();
</script>
</body></html>
